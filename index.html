<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Dashboard Pro</title>
    <!-- Font Google: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Library Grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* ==== CSS DARK MODE PREMIUM ==== */
        :root {
            --bg: #0b0e14;
            --card-bg: rgba(22, 27, 34, 0.8);
            --text: #e6edf3;
            --accent: #3b82f6;
            --profit: #10b981;
            --loss: #ef4444;
            --border: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #1f2937, #0b0e14);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1, h2 { text-align: center; font-weight: 600; }
        h1 { font-size: 28px; margin-bottom: 20px; background: -webkit-linear-gradient(#60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Ringkasan Kartu */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .card h3 { font-size: 12px; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .card p { font-size: 20px; font-weight: 700; }

        /* Grafik */
        .chart-container {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            height: 250px;
            backdrop-filter: blur(10px);
        }

        /* Form Section */
        .form-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .form-section h2 { font-size: 18px; margin-bottom: 15px; color: #a78bfa; }

        #form-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }

        input, select, button {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0d1117;
            color: var(--text);
            font-family: 'Poppins', sans-serif;
            outline: none;
            font-size: 14px;
        }

        input:focus, select:focus { border-color: var(--accent); }

        button {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4); }

        #auto-preview { text-align: center; margin-top: 15px; font-weight: 600; font-size: 14px; color: #8b949e; }

        /* Tabel */
        .table-responsive { overflow-x: auto; border-radius: 12px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        th, td { padding: 12px 15px; text-align: left; font-size: 14px; border-bottom: 1px solid var(--border); }
        th { background: rgba(33, 38, 45, 0.8); font-weight: 600; color: #8b949e; }

        .profit { color: var(--profit); text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
        .loss { color: var(--loss); text-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }

        .delete-btn { background: transparent; color: var(--loss); border: 1px solid var(--loss); padding: 5px 10px; border-radius: 6px; font-size: 12px; }
        .delete-btn:hover { background: var(--loss); color: white; box-shadow: none; transform: none; }

        @media (max-width: 600px) {
            .summary-cards { grid-template-columns: 1fr; }
            #form-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Trading Dashboard</h1>
        
        <div class="summary-cards">
            <div class="card">
                <h3>Total P&L</h3>
                <p id="total-pnl" class="profit">$0.00</p>
            </div>
            <div class="card">
                <h3>Win Rate</h3>
                <p id="win-rate">0%</p>
            </div>
            <div class="card">
                <h3>Total Trade</h3>
                <p id="total-trades">0</p>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="myChart"></canvas>
        </div>

        <div class="form-section">
            <h2>Catat Trade Baru</h2>
            <div id="form-container">
                <input type="text" id="asset" placeholder="Aset (BTC, ETH)">
                <select id="type">
                    <option value="Buy">Buy (Long)</option>
                    <option value="Sell">Sell (Short)</option>
                </select>
                <input type="number" id="entry" placeholder="Harga Masuk">
                <input type="number" id="exit" placeholder="Harga Keluar">
                <button onclick="addTrade()">Tambah Trade</button>
            </div>
            <p id="auto-preview">P&L Otomatis: $0.00</p>
        </div>

        <h2 style="margin-bottom: 10px;">Riwayat Trade</h2>
        <div class="table-responsive">
            <table id="trade-table">
                <thead>
                    <tr>
                        <th>Aset</th>
                        <th>Tipe</th>
                        <th>Entry</th>
                        <th>Exit</th>
                        <th>P&L</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        // ==== JAVASCRIPT OTOMASI & GRAFIK ====
        let trades = JSON.parse(localStorage.getItem('trades')) || [];
        let chartInstance = null;

        function updateAutoPreview() {
            const type = document.getElementById('type').value;
            const entry = parseFloat(document.getElementById('entry').value);
            const exit = parseFloat(document.getElementById('exit').value);
            const previewText = document.getElementById('auto-preview');

            if (!isNaN(entry) && !isNaN(exit)) {
                const pnl = type === 'Buy' ? (exit - entry) : (entry - exit);
                previewText.textContent = `P&L Otomatis: $${pnl.toFixed(2)}`;
                previewText.className = pnl >= 0 ? 'profit' : 'loss';
            } else {
                previewText.textContent = 'P&L Otomatis: $0.00';
                previewText.className = '';
            }
        }

        document.getElementById('entry').addEventListener('input', updateAutoPreview);
        document.getElementById('exit').addEventListener('input', updateAutoPreview);
        document.getElementById('type').addEventListener('change', updateAutoPreview);

        function addTrade() {
            const asset = document.getElementById('asset').value;
            const type = document.getElementById('type').value;
            const entry = parseFloat(document.getElementById('entry').value);
            const exit = parseFloat(document.getElementById('exit').value);

            if (!asset || isNaN(entry) || isNaN(exit)) {
                alert('Mohon isi semua data dengan benar.');
                return;
            }

            trades.push({ asset, type, entry, exit });
            saveAndRender();
            
            document.getElementById('asset').value = '';
            document.getElementById('entry').value = '';
            document.getElementById('exit').value = '';
            updateAutoPreview();
        }

        function deleteTrade(index) {
            if (confirm('Yakin ingin menghapus trade ini?')) {
                trades.splice(index, 1);
                saveAndRender();
            }
        }

        function saveAndRender() {
            localStorage.setItem('trades', JSON.stringify(trades));
            renderTrades();
            updateSummary();
            updateChart();
        }

        function renderTrades() {
            const tbody = document.querySelector('#trade-table tbody');
            tbody.innerHTML = '';
            [...trades].reverse().forEach((trade, reversedIndex) => {
                const originalIndex = trades.length - 1 - reversedIndex;
                const pnl = trade.type === 'Buy' ? (trade.exit - trade.entry) : (trade.entry - trade.exit);
                const pnlClass = pnl >= 0 ? 'profit' : 'loss';
                
                const row = `
                    <tr>
                        <td><strong>${trade.asset.toUpperCase()}</strong></td>
                        <td>${trade.type}</td>
                        <td>$${trade.entry}</td>
                        <td>$${trade.exit}</td>
                        <td class="${pnlClass}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</td>
                        <td><button class="delete-btn" onclick="deleteTrade(${originalIndex})">Hapus</button></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        function updateSummary() {
            let totalPnl = 0;
            let wins = 0;

            trades.forEach(trade => {
                const pnl = trade.type === 'Buy' ? (trade.exit - trade.entry) : (trade.entry - trade.exit);
                totalPnl += pnl;
                if (pnl > 0) wins++;
            });

            const winRate = trades.length > 0 ? (wins / trades.length) * 100 : 0;
            
            const pnlElement = document.getElementById('total-pnl');
            pnlElement.textContent = `${totalPnl >= 0 ? '+' : ''}$${totalPnl.toFixed(2)}`;
            pnlElement.className = totalPnl >= 0 ? 'profit' : 'loss';
            
            document.getElementById('win-rate').textContent = `${winRate.toFixed(1)}%`;
            document.getElementById('total-trades').textContent = trades.length;
        }

        function updateChart() {
            const ctx = document.getElementById('myChart').getContext('2d');
            let cumulativePnl = 0;
            const labels = [];
            const dataPoints = [];

            trades.forEach((trade, index) => {
                const pnl = trade.type === 'Buy' ? (trade.exit - trade.entry) : (trade.entry - trade.exit);
                cumulativePnl += pnl;
                labels.push(`T${index + 1}`);
                dataPoints.push(cumulativePnl);
            });

            if (chartInstance) { chartInstance.destroy(); }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Akumulasi P&L ($)',
                        data: dataPoints,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#a78bfa'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#8b949e' }, grid: { display: false } },
                        y: { ticks: { color: '#8b949e' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }

        renderTrades();
        updateSummary();
        updateChart();
    </script>
</body>
</html>
