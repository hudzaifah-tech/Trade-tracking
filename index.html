<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trade Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>📊 Trade Tracker</h1>

    <div id="form-container">
        <input type="text" id="asset" placeholder="Aset (misal: BTC)">
        <select id="type">
            <option value="Buy">Buy</option>
            <option value="Sell">Sell</option>
        </select>
        <input type="number" id="entry" placeholder="Harga Masuk">
        <input type="number" id="exit" placeholder="Harga Keluar">
        <button onclick="addTrade()">Tambah Trade</button>
    </div>

    <h2>Riwayat Trade</h2>
    <table id="trade-table">
        <thead>
            <tr>
                <th>Aset</th>
                <th>Tipe</th>
                <th>Entry</th>
                <th>Exit</th>
                <th>P&L</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
