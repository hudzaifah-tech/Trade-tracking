<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IDX Portfolio Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0b0e14; --card-bg: #161b22; --text: #e6edf3; --accent: #3b82f6; --profit: #10b981; --loss: #ef4444; --border: #30363d; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 70px; }
        .page { display: none; padding: 15px; max-width: 800px; margin: 0 auto; }
        .page.active { display: block; }
        h1 { font-size: 22px; margin-bottom: 15px; text-align: center; color: #60a5fa; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; }
        input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: #0d1117; color: var(--text); margin-bottom: 10px; }
        button { cursor: pointer; font-weight: 600; border: none; }
        .btn-buy { background: var(--profit); color: white; }
        .btn-sell { background: var(--loss); color: white; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #161b22; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border); }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #8b949e; background: none; border: none; }
        .nav-item.active { color: var(--accent); }
    </style>
</head>
<body>
    <div id="page-dashboard" class="page active"><h1>📊 Dashboard Porto</h1><div class="card">Halaman Utama (Porto) Berhasil Dimuat!</div></div>
    <div id="page-trade" class="page"><h1>💸 Transaksi</h1><div class="card">Halaman Trade Berhasil Dibuka!</div></div>
    <div id="page-history" class="page"><h1>📜 Riwayat</h1><div class="card">Halaman History Berhasil Dibuka!</div></div>
    <div id="page-harmonic" class="page"><h1>📐 Harmonic</h1><div class="card">Halaman Harmonic Berhasil Dibuka!</div></div>
    <div id="page-profile" class="page"><h1>👤 Profil</h1><div class="card">Halaman Profile Berhasil Dibuka!</div></div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('dashboard', this)">Porto</button>
        <button class="nav-item" onclick="switchPage('trade', this)">Trade</button>
        <button class="nav-item" onclick="switchPage('history', this)">History</button>
        <button class="nav-item" onclick="switchPage('harmonic', this)">Harmonic</button>
        <button class="nav-item" onclick="switchPage('profile', this)">Profile</button>
    </div>

    <script>
        function switchPage(pageId, btn) {
            // Sembunyikan semua halaman
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            // Tampilkan halaman yang dipilih
            document.getElementById('page-' + pageId).classList.add('active');
            // Atur warna tombol
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
